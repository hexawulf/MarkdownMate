name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Server bundle and source maps are not in the public directory
        run: |
          test -f dist/index.js
          test -f dist/public/index.html
          test ! -e dist/public/index.js
          test -z "$(find dist -name '*.map' -print -quit)"

      # The browser is pinned by @playwright/test's exact version in
      # package.json, so this downloads the same build every run. Only chromium:
      # a second WebAssembly download per browser buys little for a smoke test.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Drives the production build (node dist/index.js) through the browser —
      # the only place helmet's CSP and the real headers apply. A CSP mistake
      # (e.g. dropping img-src https:) fails here instead of shipping.
      - name: Browser smoke test (e2e)
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
