name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Server bundle and source maps are not in the public directory
        run: |
          test -f dist/index.js
          test -f dist/public/index.html
          test ! -e dist/public/index.js
          test -z "$(find dist -name '*.map' -print -quit)"

      # The browser is pinned by @playwright/test's exact version in
      # package.json, so this downloads the same build every run. Only chromium:
      # a second WebAssembly download per browser buys little for a smoke test.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Drives the production build (node dist/index.js) through the browser —
      # the only place helmet's CSP and the real headers apply. A CSP mistake
      # (e.g. dropping img-src https:) fails here instead of shipping.
      - name: Browser smoke test (e2e)
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
